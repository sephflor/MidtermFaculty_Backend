        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Announcements retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnnouncementItem'

    post:
      tags:
        - Announcements
      summary: Create announcement
      description: Dean creates an announcement.
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementPayload'
      responses:
        '201':
          description: Announcement created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementItem'

  /announcements/{announcementId}:
    parameters:
      - $ref: '#/components/parameters/AnnouncementId'

    get:
      tags:
        - Announcements
      summary: Get announcement by ID
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Announcement retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementItem'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Announcements
      summary: Update announcement
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementPayload'
      responses:
        '200':
          description: Announcement updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementItem'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Announcements
      summary: Delete announcement
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Announcement deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

# ============================================================
# COMPONENTS
# ============================================================

components:

  # ==========================================================
  # SECURITY
  # ==========================================================

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ==========================================================
  # PARAMETERS
  # ==========================================================

  parameters:

    FacultyId:
      name: facultyId
      in: path
      required: true
      description: Unique faculty identifier
      schema:
        type: string
      example: FAC-001

    CourseCode:
      name: courseCode
      in: path
      required: true
      description: Course code
      schema:
        type: string
      example: BSIT

    SubjectCode:
      name: subjectCode
      in: path
      required: true
      description: Subject code
      schema:
        type: string
      example: IT101

    SectionId:
      name: sectionId
      in: path
      required: true
      description: Unique section identifier
      schema:
        type: string
      example: SEC-001

    AssignmentId:
      name: assignmentId
      in: path
      required: true
      description: Unique faculty subject assignment identifier
      schema:
        type: string
      example: ASG-001

    StudentId:
      name: studentId
      in: path
      required: true
      description: Unique student identifier
      schema:
        type: string
      example: STU-001

    AttendanceId:
      name: attendanceId
      in: path
      required: true
      description: Unique attendance record identifier
      schema:
        type: string
      example: ATT-001

    ScheduleId:
      name: scheduleId
      in: path
      required: true
      description: Unique schedule identifier
      schema:
        type: string
      example: SCH-001

    AnnouncementId:
      name: announcementId
      in: path
      required: true
      description: Unique announcement identifier
      schema:
        type: string
      example: ANN-001

  # ==========================================================
  # SCHEMAS
  # ==========================================================

  schemas:

    # --------------------------------------------------------
    # FACULTY
    # --------------------------------------------------------

    FacultyItem:
      type: object
      required:
        - facultyId
        - employeeId
        - firstName
        - lastName
        - position
        - employmentType
        - status
      properties:
        facultyId:
          type: string
          example: FAC-001

        employeeId:
          type: string
          example: EMP-001

        firstName:
          type: string
          example: Juan

        lastName:
          type: string
          example: Dela Cruz

        middleName:
          type: string
          nullable: true
          example: Santos

        email:
          type: string
          format: email
          example: juan.delacruz@example.com

        position:
          type: string
          enum:
            - FACULTY
            - PROGRAM_HEAD
            - DEAN
          example: FACULTY

        employmentType:
          type: string
          enum:
            - FULL_TIME
            - PART_TIME
            - OTHER
          example: FULL_TIME

        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - RESIGNED
            - ON_LEAVE
          example: ACTIVE

        assignedSubjects:
          type: array
          items:
            $ref: '#/components/schemas/AssignedSubjectItem'

    FacultyPayload:
      type: object
      required:
        - employeeId
        - firstName
        - lastName
        - position
        - employmentType
      properties:
        employeeId:
          type: string
          example: EMP-001

        firstName:
          type: string
          example: Juan

        lastName:
          type: string
          example: Dela Cruz

        middleName:
          type: string
          nullable: true
          example: Santos

        email:
          type: string
          format: email
          example: juan.delacruz@example.com

        position:
          type: string
          enum:
            - FACULTY
            - PROGRAM_HEAD
            - DEAN

        employmentType:
          type: string
          enum:
            - FULL_TIME
            - PART_TIME
            - OTHER

        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - RESIGNED
            - ON_LEAVE

    SalaryResponse:
      type: object
      properties:
        facultyId:
          type: string
          example: FAC-001
        employmentType:
          type: string
          example: FULL_TIME
        salary:
          type: number
          format: double
          example: 35000.00
        currency:
          type: string
          example: PHP

    # --------------------------------------------------------
    # COURSE
    # --------------------------------------------------------

    CourseItem:
      type: object
      required:
        - courseCode
        - courseName
      properties:
        courseCode:
          type: string
          example: BSIT
        courseName:
          type: string
          example: Bachelor of Science in Information Technology
        description:
          type: string
          nullable: true
          example: Information Technology program

    CoursePayload:
      type: object
      required:
        - courseCode
        - courseName
      properties:
        courseCode:
          type: string
          example: BSIT
        courseName:
          type: string
          example: Bachelor of Science in Information Technology
        description:
          type: string
          nullable: true

    # --------------------------------------------------------
    # SUBJECT
    # --------------------------------------------------------

    SubjectItem:
      type: object
      required:
        - subjectCode
        - subjectName
        - courseCode
      properties:
        subjectCode:
          type: string
          example: IT101

        subjectName:
          type: string
          example: Introduction to Information Technology

        courseCode:
          type: string
          example: BSIT

        units:
          type: integer
          example: 3

        description:
          type: string
          nullable: true

    SubjectPayload:
      type: object
      required:
        - subjectCode
        - subjectName
        - courseCode
      properties:
        subjectCode:
          type: string
          example: IT101

        subjectName:
          type: string
          example: Introduction to Information Technology

        courseCode:
          type: string
          example: BSIT

        units:
          type: integer
          minimum: 1
          example: 3

        description:
          type: string
          nullable: true

    # --------------------------------------------------------
    # SECTION
    # --------------------------------------------------------

    SectionItem:
      type: object
      required:
        - sectionId
        - sectionName
      properties:
        sectionId:
          type: string
          example: SEC-001

        sectionName:
          type: string
          example: BSIT-3A

        courseCode:
          type: string
          example: BSIT

        yearLevel:
          type: integer
          example: 3

        academicYear:
          type: string
          example: 2026-2027

    SectionPayload:
      type: object
      required:
        - sectionName
        - courseCode
        - yearLevel
      properties:
        sectionName:
          type: string
          example: BSIT-3A

        courseCode:
          type: string
          example: BSIT

        yearLevel:
          type: integer
          example: 3

        academicYear:
          type: string
          example: 2026-2027

    # --------------------------------------------------------
    # ASSIGNMENT
    # --------------------------------------------------------

    AssignedSubjectItem:
      type: object
      required:
        - assignmentId
        - facultyId
        - subjectCode
        - sectionId
        - semester
        - academicYear
      properties:
        assignmentId:
          type: string
          example: ASG-001

        facultyId:
          type: string
          example: FAC-001

        subjectCode:
          type: string
          example: IT101

        subjectName:
          type: string
          example: Introduction to Information Technology

        sectionId:
          type: string
          example: SEC-001

        sectionName:
          type: string
          example: BSIT-3A

        semester:
          type: string
          enum:
            - FIRST
            - SECOND
            - SUMMER
          example: FIRST

        academicYear:
          type: string
          example: 2026-2027

    AssignSubjectPayload:
      type: object
      required:
        - subjectCode
        - sectionId
        - semester
        - academicYear
      properties:
        subjectCode:
          type: string
          example: IT101

        sectionId:
          type: string
          example: SEC-001

        semester:
          type: string
          enum:
            - FIRST
            - SECOND
            - SUMMER

        academicYear:
          type: string
          example: 2026-2027

    # --------------------------------------------------------
    # STUDENT
    # --------------------------------------------------------

    StudentItem:
      type: object
      required:
        - studentId
        - studentNumber
        - firstName
        - lastName
      properties:
        studentId:
          type: string
          example: STU-001

        studentNumber:
          type: string
          example: 2023-00001

        firstName:
          type: string
          example: Maria

        lastName:
          type: string
          example: Santos

        middleName:
          type: string
          nullable: true
          example: Cruz

        email:
          type: string
          format: email
          example: maria.santos@example.com

        sectionId:
          type: string
          example: SEC-001

    # --------------------------------------------------------
    # GRADES
    # --------------------------------------------------------

    GradeItem:
      type: object
      required:
        - gradeId
        - assignmentId
        - studentId
        - grade
      properties:
        gradeId:
          type: string
          example: GRD-001

        assignmentId:
          type: string
          example: ASG-001

        studentId:
          type: string
          example: STU-001

        grade:
          type: number
          format: double
          example: 1.50

        remarks:
          type: string
          nullable: true
          example: Passed

        updatedAt:
          type: string
          format: date-time
          example: "2026-10-04T10:00:00Z"

    GradePayload:
      type: object
      required:
        - grade
      properties:
        grade:
          type: number
          format: double
          example: 1.50

        remarks:
          type: string
          nullable: true
          example: Passed

    # --------------------------------------------------------
    # ATTENDANCE
    # --------------------------------------------------------

    AttendanceItem:
      type: object
      required:
        - attendanceId
        - assignmentId
        - facultyId
        - studentId
        - attendanceDate
        - status
      properties:
        attendanceId:
          type: string
          example: ATT-001

        assignmentId:
          type: string
          example: ASG-001

        facultyId:
          type: string
          example: FAC-001

        studentId:
          type: string
          example: STU-001

        studentNumber:
          type: string
          example: 2023-00001

        studentName:
          type: string
          example: Maria Santos

        attendanceDate:
          type: string
          format: date
          example: "2026-10-04"

        status:
          type: string
          enum:
            - PRESENT
            - ABSENT
            - LATE
            - EXCUSED
          example: PRESENT

        remarks:
          type: string
          nullable: true
          example: Arrived 15 minutes late

        recordedAt:
          type: string
          format: date-time
          example: "2026-10-04T08:05:00Z"

    AttendancePayload:
      type: object
      required:
        - attendanceDate
        - records
      properties:
        attendanceDate:
          type: string
          format: date
          example: "2026-10-04"

        records:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AttendanceRecordPayload'

    AttendanceRecordPayload:
      type: object
      required:
        - studentId
        - status
      properties:
        studentId:
          type: string
          example: STU-001

        status:
          type: string
          enum:
            - PRESENT
            - ABSENT
            - LATE
            - EXCUSED
          example: PRESENT

        remarks:
          type: string
          nullable: true
          example: Arrived 15 minutes late

    AttendanceUpdatePayload:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - PRESENT
            - ABSENT
            - LATE
            - EXCUSED
          example: EXCUSED

        remarks:
          type: string
          nullable: true
          example: Medical reason

    # --------------------------------------------------------
    # SCHEDULE
    # --------------------------------------------------------

    ScheduleItem:
      type: object
      required:
        - scheduleId
        - assignmentId
        - day
        - startTime
        - endTime
      properties:
        scheduleId:
          type: string
          example: SCH-001

        assignmentId:
          type: string
          example: ASG-001

        day:
          type: string
          enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
          example: MONDAY

        startTime:
          type: string
          example: "08:00"

        endTime:
          type: string
          example: "10:00"

        room:
          type: string
          nullable: true
          example: Room 301

    SchedulePayload:
      type: object
      required:
        - assignmentId
        - day
        - startTime
        - endTime
      properties:
        assignmentId:
          type: string
          example: ASG-001

        day:
          type: string
          enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY

        startTime:
          type: string
          example: "08:00"

        endTime:
          type: string
          example: "10:00"

        room:
          type: string
          nullable: true
          example: Room 301

    # --------------------------------------------------------
    # ANNOUNCEMENTS
    # --------------------------------------------------------

    AnnouncementItem:
      type: object
      required:
        - announcementId
        - title
        - content
      properties:
        announcementId:
          type: string
          example: ANN-001

        title:
          type: string
          example: Midterm Examination

        content:
          type: string
          example: Midterm examinations will begin next week.

        postedBy:
          type: string
          example: FAC-001

        createdAt:
          type: string
          format: date-time
          example: "2026-10-04T08:00:00Z"

        updatedAt:
          type: string
          format: date-time
          nullable: true

    AnnouncementPayload:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          example: Midterm Examination

        content:
          type: string
          example: Midterm examinations will begin next week.

    # --------------------------------------------------------
    # ERRORS
    # --------------------------------------------------------

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Resource not found

        error:
          type: string
          nullable: true
          example: NOT_FOUND

        details:
          type: object
          additionalProperties: true
          nullable: true

  # ==========================================================
  # COMMON RESPONSES
  # ==========================================================

  responses:

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication required or token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: User does not have permission to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'