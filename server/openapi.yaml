openapi: 3.0.3

info:
  title: IDSC Portal - Faculty System API
  description: |
    API for the IDSC Portal Faculty System.

    The system allows faculty members to:
    - View their assigned subjects and sections
    - View students enrolled in their assigned subjects
    - Manage student grades
    - Manage student attendance
    - View schedules
    - View announcements

    Dean users have authorization to manage:
    - Faculty
    - Courses
    - Subjects
    - Sections
    - Faculty subject assignments
    - Schedules
    - Announcements
    - Student grades
    - Student attendance
  version: 1.4.0

servers:
  - url: http://localhost:5000/api
    description: Local development server

tags:
  - name: Faculty
    description: Faculty management
  - name: Courses
    description: Course management
  - name: Subjects
    description: Subject management
  - name: Sections
    description: Section management
  - name: Faculty Subject Assignments
    description: Assign subjects and sections to faculty
  - name: Students
    description: Students enrolled in faculty subject assignments
  - name: Grades
    description: Student grade management
  - name: Attendance
    description: Student attendance management
  - name: Schedules
    description: Class schedule management
  - name: Announcements
    description: Announcement management

paths:

  # ==========================================================
  # FACULTY
  # ==========================================================

  /faculty:
    get:
      tags:
        - Faculty
      summary: Get all faculty
      description: Dean can view all faculty members.
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Faculty list retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacultyItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Faculty
      summary: Create faculty
      description: Dean creates a new faculty member.
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacultyPayload'
      responses:
        '201':
          description: Faculty created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /faculty/{facultyId}:
    parameters:
      - $ref: '#/components/parameters/FacultyId'

    get:
      tags:
        - Faculty
      summary: Get faculty by ID
      description: Get faculty information by faculty ID.
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Faculty retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Faculty
      summary: Update faculty
      description: Dean updates faculty information.
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacultyPayload'
      responses:
        '200':
          description: Faculty updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Faculty
      summary: Delete faculty
      description: Dean deletes a faculty member.
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Faculty deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /faculty/{facultyId}/salary:
    parameters:
      - $ref: '#/components/parameters/FacultyId'

    get:
      tags:
        - Faculty
      summary: Get faculty salary
      description: Calculate or retrieve faculty salary based on employment type.
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Salary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================
  # COURSES
  # ==========================================================

  /courses:
    get:
      tags:
        - Courses
      summary: Get all courses
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Course list retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Courses
      summary: Create course
      description: Dean creates a course.
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoursePayload'
      responses:
        '201':
          description: Course created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /courses/{courseCode}:
    parameters:
      - $ref: '#/components/parameters/CourseCode'

    get:
      tags:
        - Courses
      summary: Get course by code
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Course retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseItem'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Courses
      summary: Update course
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoursePayload'
      responses:
        '200':
          description: Course updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Courses
      summary: Delete course
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Course deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================
  # SUBJECTS
  # ==========================================================

  /subjects:
    get:
      tags:
        - Subjects
      summary: Get all subjects
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subject list retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubjectItem'

    post:
      tags:
        - Subjects
      summary: Create subject
      description: Dean creates a new subject.
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectPayload'
      responses:
        '201':
          description: Subject created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /subjects/{subjectCode}:
    parameters:
      - $ref: '#/components/parameters/SubjectCode'

    get:
      tags:
        - Subjects
      summary: Get subject by code
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subject retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectItem'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Subjects
      summary: Update subject
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectPayload'
      responses:
        '200':
          description: Subject updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Subjects
      summary: Delete subject
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Subject deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================
  # SECTIONS
  # ==========================================================

  /sections:
    get:
      tags:
        - Sections
      summary: Get all sections
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Section list retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SectionItem'

    post:
      tags:
        - Sections
      summary: Create section
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionPayload'
      responses:
        '201':
          description: Section created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /sections/{sectionId}:
    parameters:
      - $ref: '#/components/parameters/SectionId'

    get:
      tags:
        - Sections
      summary: Get section by ID
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Section retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionItem'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Sections
      summary: Update section
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionPayload'
      responses:
        '200':
          description: Section updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Sections
      summary: Delete section
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Section deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================
  # FACULTY SUBJECT ASSIGNMENTS
  # ==========================================================

  /faculty/{facultyId}/subjects:
    parameters:
      - $ref: '#/components/parameters/FacultyId'

    get:
      tags:
        - Faculty Subject Assignments
      summary: Get faculty subject assignments
      description: |
        Returns all subjects and sections assigned to a faculty member.
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Assignments retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssignedSubjectItem'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Faculty Subject Assignments
      summary: Assign subject and section to faculty
      description: Dean assigns a subject and section to a faculty member.
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignSubjectPayload'
      responses:
        '201':
          description: Subject assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignedSubjectItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /faculty/{facultyId}/subjects/{assignmentId}:
    parameters:
      - $ref: '#/components/parameters/FacultyId'
      - $ref: '#/components/parameters/AssignmentId'

    delete:
      tags:
        - Faculty Subject Assignments
      summary: Remove faculty subject assignment
      description: Dean removes a subject assignment from a faculty member.
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Assignment removed successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /faculty/{facultyId}/courses:
    parameters:
      - $ref: '#/components/parameters/FacultyId'

    get:
      tags:
        - Faculty Subject Assignments
      summary: Get faculty courses
      description: Returns courses related to the faculty's assigned subjects.
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Faculty courses retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseItem'

  # ==========================================================
  # STUDENTS
  # ==========================================================

  /faculty/{facultyId}/subjects/{assignmentId}/students:
    parameters:
      - $ref: '#/components/parameters/FacultyId'
      - $ref: '#/components/parameters/AssignmentId'

    get:
      tags:
        - Students
      summary: Get students in assigned subject
      description: |
        Returns students enrolled in the section assigned to the faculty
        for the selected subject assignment.
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Students retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================
  # GRADES
  # ==========================================================

  /faculty/{facultyId}/subjects/{assignmentId}/students/{studentId}/grade:
    parameters:
      - $ref: '#/components/parameters/FacultyId'
      - $ref: '#/components/parameters/AssignmentId'
      - $ref: '#/components/parameters/StudentId'

    post:
      tags:
        - Grades
      summary: Add student grade
      description: Faculty or Dean records a student's grade.
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradePayload'
      responses:
        '201':
          description: Grade recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    put:
      tags:
        - Grades
      summary: Update student grade
      description: Faculty or Dean updates a student's grade.
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradePayload'
      responses:
        '200':
          description: Grade updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      tags:
        - Grades
      summary: Get student grade
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Grade retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeItem'
        '404':
          $ref: '#/components/responses/NotFound'

  /faculty/{facultyId}/subjects/{assignmentId}/grades:
    parameters:
      - $ref: '#/components/parameters/FacultyId'
      - $ref: '#/components/parameters/AssignmentId'

    get:
      tags:
        - Grades
      summary: Get all grades for assigned subject
      description: Returns grades of all students in the selected subject assignment.
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Grades retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GradeItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================
  # ATTENDANCE
  # ==========================================================

  /faculty/{facultyId}/subjects/{assignmentId}/attendance:
    parameters:
      - $ref: '#/components/parameters/FacultyId'
      - $ref: '#/components/parameters/AssignmentId'

    get:
      tags:
        - Attendance
      summary: Get attendance for assigned subject
      description: |
        Returns attendance records for students enrolled in the selected
        subject assignment.
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Attendance records retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Attendance
      summary: Record attendance
      description: |
        Records attendance for multiple students in one request.
        This is useful when a faculty member takes attendance for an
        entire class or section.
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendancePayload'
      responses:
        '201':
          description: Attendance recorded successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Attendance already exists for one or more students on this date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /faculty/{facultyId}/subjects/{assignmentId}/students/{studentId}/attendance:
    parameters:
      - $ref: '#/components/parameters/FacultyId'
      - $ref: '#/components/parameters/AssignmentId'
      - $ref: '#/components/parameters/StudentId'

    get:
      tags:
        - Attendance
      summary: Get student attendance history
      description: |
        Returns the attendance history of a specific student for the
        selected subject assignment.
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Student attendance history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /faculty/{facultyId}/subjects/{assignmentId}/students/{studentId}/attendance/{attendanceId}:
    parameters:
      - $ref: '#/components/parameters/FacultyId'
      - $ref: '#/components/parameters/AssignmentId'
      - $ref: '#/components/parameters/StudentId'
      - $ref: '#/components/parameters/AttendanceId'

    put:
      tags:
        - Attendance
      summary: Update student attendance
      description: |
        Updates an existing attendance record. This can be used to
        correct an attendance status or remarks.
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceUpdatePayload'
      responses:
        '200':
          description: Attendance updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Attendance
      summary: Delete attendance record
      description: |
        Deletes an attendance record. This can be used to correct
        an incorrectly recorded attendance.
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Attendance deleted successfully
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================
  # SCHEDULES
  # ==========================================================

  /schedules:
    get:
      tags:
        - Schedules
      summary: Get all schedules
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Schedules retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleItem'

    post:
      tags:
        - Schedules
      summary: Create schedule
      description: Dean creates a schedule for a subject assignment.
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePayload'
      responses:
        '201':
          description: Schedule created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /schedules/{scheduleId}:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'

    get:
      tags:
        - Schedules
      summary: Get schedule by ID
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Schedule retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleItem'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Schedules
      summary: Update schedule
      x-roles:
        - DEAN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePayload'
      responses:
        '200':
          description: Schedule updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleItem'
        '404':
