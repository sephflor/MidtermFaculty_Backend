        '404':
          $ref: '#/components/responses/NotFound'

  /faculty/{facultyId}/schedule:
    parameters:
      - $ref: '#/components/parameters/FacultyId'

    get:
      tags:
        - Schedules
      summary: Get faculty schedule
      x-roles:
        - DEAN
        - FACULTY
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Faculty schedule retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleItem'

  # ==========================================================
  # ANNOUNCEMENTS
  # ==========================================================

  /announcements:
    get:
      tags:
        - Announcements
      summary: Get announcements
      x-roles:
